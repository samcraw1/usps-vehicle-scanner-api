<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USPS Inspection History</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
    color: white;
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
  }
  .container { max-width: 820px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { margin: 0 0 8px; font-size: 30px; }
  header p { margin: 0; opacity: 0.7; }

  .stats { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 130px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px; padding: 16px; text-align: center;
    backdrop-filter: blur(8px);
  }
  .stat .num { font-size: 26px; font-weight: bold; }
  .stat .lbl { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

  .updated { font-size: 12px; opacity: 0.6; text-align: right; margin-bottom: 12px; }

  .scan {
    background: white; color: #1a1a1a;
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    border-left: 6px solid #5b6770;
  }
  .scan.PASS { border-left-color: #28a745; }
  .scan.ATTENTION { border-left-color: #ffc107; }
  .scan.UNSAFE { border-left-color: #dc3545; }

  .scan-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .pill { padding: 5px 12px; border-radius: 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
  .pill.PASS { background: #d4edda; color: #155724; }
  .pill.ATTENTION { background: #fff3cd; color: #856404; }
  .pill.UNSAFE { background: #f8d7da; color: #721c24; }

  .meta { font-size: 12px; color: #5b6770; font-variant-numeric: tabular-nums; }
  .summary { margin: 12px 0; font-size: 15px; line-height: 1.5; }

  .issues { list-style: none; margin: 0; padding: 0; }
  .issue {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 12px; background: #f4f6f8; border-radius: 8px; margin-top: 8px; font-size: 14px;
  }
  .issue .where { color: #5b6770; font-size: 12px; }
  .sev { padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .sev.LOW { background: #d4edda; color: #155724; }
  .sev.MEDIUM { background: #fff3cd; color: #856404; }
  .sev.HIGH { background: #f8d7da; color: #721c24; }
  .clear { color: #155724; font-weight: 600; margin-top: 8px; }

  .empty { text-align: center; padding: 50px 20px; opacity: 0.7; }
  .footer { text-align: center; margin-top: 24px; opacity: 0.6; font-size: 13px; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔍 USPS Inspection History</h1>
      <p>Recent vehicle scans graded by OpenAI Vision — newest first</p>
    </header>

    <div class="stats" id="stats"></div>
    <div class="updated" id="updated">Loading...</div>
    <div id="list">
      <div class="empty">Loading inspections...</div>
    </div>

    <div class="footer">Live feed from <code>/api/history</code> · Spring Boot + OpenAI Vision on AWS</div>
  </div>

<script>
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString();
}

function fmtSize(bytes) {
  if (!bytes) return '';
  return bytes < 1024 ? bytes + ' B' : (bytes / 1024).toFixed(0) + ' KB';
}

function render(data) {
  const list = document.getElementById('list');
  if (!data.length) {
    list.innerHTML = '<div class="empty">No inspections yet. Run a scan and it will appear here.</div>';
  } else {
    list.innerHTML = data.map(entry => {
      const r = entry.result || {};
      const status = r.status || 'UNKNOWN';
      const issues = Array.isArray(r.issues) ? r.issues : [];
      const issuesHtml = issues.length
        ? '<ul class="issues">' + issues.map(i => `
            <li class="issue">
              <span><strong>${escapeHtml(i.issue)}</strong> <span class="where">— ${escapeHtml(i.location)}</span></span>
              <span class="sev ${escapeHtml(i.severity)}">${escapeHtml(i.severity)}</span>
            </li>`).join('') + '</ul>'
        : '<div class="clear">✓ No issues detected — vehicle cleared for route</div>';
      return `
        <div class="scan ${escapeHtml(status)}">
          <div class="scan-head">
            <span class="pill ${escapeHtml(status)}">${escapeHtml(status)}</span>
            <span class="meta">${escapeHtml(entry.filename || 'image')} · ${fmtSize(entry.imageSize)} · ${fmtTime(entry.timestamp)}</span>
          </div>
          <div class="summary">${escapeHtml(r.summary)}</div>
          ${issuesHtml}
        </div>`;
    }).join('');
  }

  // stats
  const total = data.length;
  const count = s => data.filter(e => (e.result || {}).status === s).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">Total Scans</div></div>
    <div class="stat"><div class="num">${count('PASS')}</div><div class="lbl">Pass</div></div>
    <div class="stat"><div class="num">${count('ATTENTION')}</div><div class="lbl">Attention</div></div>
    <div class="stat"><div class="num">${count('UNSAFE')}</div><div class="lbl">Unsafe</div></div>
  `;
}

async function refresh() {
  try {
    const res = await fetch('/api/history');
    const data = await res.json();
    render(data);
    document.getElementById('updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('updated').textContent = 'Error: ' + err.message;
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
