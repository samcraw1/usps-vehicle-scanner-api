<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USPS Vehicle Scanner</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 32px;
    color: #1a1a1a;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header {
    background: #00427b;
    color: white;
    padding: 20px 24px;
    border-radius: 12px 12px 0 0;
  }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }
  .card {
    background: white;
    padding: 24px;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .drop-zone {
    border: 2px dashed #cbd2d9;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #00427b;
    background: #f0f6fc;
  }
  .drop-zone p { margin: 4px 0; color: #5b6770; }
  .drop-zone .big { font-size: 16px; color: #1a1a1a; font-weight: 500; }
  input[type="file"] { display: none; }
  button {
    background: #00427b;
    color: white;
    border: none;
    padding: 14px 24px;
    font-size: 15px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    margin-top: 16px;
    font-weight: 500;
  }
  button:disabled { background: #9aa5b1; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #003366; }
  .preview { margin-top: 16px; text-align: center; }
  .preview img { max-width: 100%; max-height: 240px; border-radius: 8px; }
  .result { margin-top: 24px; }
  .status-badge {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
  }
  .status-PASS { background: #d4edda; color: #155724; }
  .status-ATTENTION { background: #fff3cd; color: #856404; }
  .status-UNSAFE { background: #f8d7da; color: #721c24; }
  .summary {
    margin: 12px 0 16px;
    font-size: 15px;
    line-height: 1.5;
  }
  .issue {
    background: #f9fafb;
    border-left: 4px solid #cbd2d9;
    padding: 12px 16px;
    margin: 8px 0;
    border-radius: 4px;
  }
  .issue.severity-HIGH { border-left-color: #dc3545; }
  .issue.severity-MEDIUM { border-left-color: #ffc107; }
  .issue.severity-LOW { border-left-color: #28a745; }
  .issue .label { font-weight: 600; font-size: 15px; }
  .issue .meta { font-size: 13px; color: #5b6770; margin-top: 4px; }
  .severity-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .severity-tag.HIGH { background: #f8d7da; color: #721c24; }
  .severity-tag.MEDIUM { background: #fff3cd; color: #856404; }
  .severity-tag.LOW { background: #d4edda; color: #155724; }
  .loading {
    text-align: center;
    padding: 24px;
    color: #5b6770;
  }
  .spinner {
    border: 3px solid #f3f3f3;
    border-top: 3px solid #00427b;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    animation: spin 1s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  details { margin-top: 16px; font-size: 13px; }
  details pre {
    background: #1a1a1a;
    color: #00ff88;
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚛 USPS Vehicle Scanner</h1>
      <p>Java + Spring Boot + OpenAI Vision (GPT-4o)</p>
    </header>
    <div class="card">
      <label class="drop-zone" id="dropZone" for="fileInput">
        <p class="big">📷 Click to choose a vehicle photo</p>
        <p>or drag & drop here</p>
      </label>
      <input type="file" id="fileInput" accept="image/*">
      <div class="preview" id="preview"></div>
      <button id="analyzeBtn" disabled>Analyze Vehicle</button>
      <div class="result" id="result"></div>
    </div>
  </div>

<script>
const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const preview = document.getElementById('preview');
const analyzeBtn = document.getElementById('analyzeBtn');
const result = document.getElementById('result');
let selectedFile = null;

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  selectedFile = file;
  const url = URL.createObjectURL(file);
  preview.innerHTML = `<img src="${url}" alt="preview">`;
  analyzeBtn.disabled = false;
  result.innerHTML = '';
}

fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

analyzeBtn.addEventListener('click', async () => {
  if (!selectedFile) return;

  analyzeBtn.disabled = true;
  result.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>Sending to Java backend → OpenAI GPT-4o...</div>
    </div>`;

  const formData = new FormData();
  formData.append('image', selectedFile);

  try {
    const start = performance.now();
    const res = await fetch('/api/inspect', { method: 'POST', body: formData });
    const elapsed = ((performance.now() - start) / 1000).toFixed(2);
    const data = await res.json();

    const issuesHtml = (data.issues || []).map(i => `
      <div class="issue severity-${(i.severity || '').toUpperCase()}">
        <div class="label">${i.issue}<span class="severity-tag ${(i.severity || '').toUpperCase()}">${i.severity || ''}</span></div>
        <div class="meta">📍 ${i.location || ''}</div>
      </div>
    `).join('');

    result.innerHTML = `
      <span class="status-badge status-${data.status}">${data.status}</span>
      <div class="summary">${data.summary || ''}</div>
      ${issuesHtml || '<p style="color:#5b6770;">No issues found ✅</p>'}
      <details>
        <summary>Raw JSON response (${elapsed}s)</summary>
        <pre>${JSON.stringify(data, null, 2)}</pre>
      </details>
    `;
  } catch (err) {
    result.innerHTML = `<div style="color:#721c24;background:#f8d7da;padding:12px;border-radius:6px;">Error: ${err.message}</div>`;
  } finally {
    analyzeBtn.disabled = false;
  }
});
</script>
</body>
</html>
